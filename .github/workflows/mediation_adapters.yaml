name: Mediation Adapters CI

permissions:
  contents: read
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check-paths:
    runs-on: ubuntu-latest
    outputs:
      example: ${{ steps.filter.outputs.example }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check changes
        id: filter
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch origin "$PR_BASE_REF" --depth=1
          CHANGED_FILES=$(git diff --name-only origin/"$PR_BASE_REF" HEAD)
          echo "Changed files:"
          echo "$CHANGED_FILES"

          if echo "$CHANGED_FILES" | grep -q "^example/"; then
            echo "example=true" >> $GITHUB_OUTPUT
          else
            echo "example=false" >> $GITHUB_OUTPUT
          fi
      - name: Block version updates in external PRs
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository &&
          !contains(github.event.pull_request.labels.*.name, 'allow-version-bump')
        run: |
          git fetch --no-tags --depth=2 origin "$GITHUB_SHA"

          MODIFIED_FILES=$(git diff --name-only --diff-filter=M HEAD^1 HEAD)
          FAILED=0

          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            ADDED_LINES=$(git diff -U0 HEAD^1 HEAD -- "$file" | grep -E '^\+[^+]' || true)
            [[ -z "$ADDED_LINES" ]] && continue

            if [[ "$file" =~ ^adapters/.+\.podspec\.json$ ]]; then
              if echo "$ADDED_LINES" | grep -q -E '^\+[[:space:]]*"version"[[:space:]]*:'; then
                echo "::error file=$file::Do not update the podspec version in PRs. Adapter versions are bumped automatically during release; add release notes under '#### Next version' in CHANGELOG.md instead."
                FAILED=1
              fi
            elif [[ "$file" =~ ^adapters/.+/Configuration/Adapter\.xcconfig$ ]]; then
              if echo "$ADDED_LINES" | grep -q -E '^\+[[:space:]]*(MARKETING_VERSION|CURRENT_PROJECT_VERSION)[[:space:]]*='; then
                echo "::error file=$file::Do not update MARKETING_VERSION or CURRENT_PROJECT_VERSION in PRs. Adapter versions are bumped automatically during release; add release notes under '#### Next version' in CHANGELOG.md instead."
                FAILED=1
              fi
            elif [[ "$file" =~ ^adapters/.+(Constants?\.(h|m|swift)|Adapter\.swift)$ ]]; then
              if echo "$ADDED_LINES" | grep -q -E '^\+.*(Version|version)[^=]*=[[:space:]]*@?"[0-9]+(\.[0-9]+){3,4}"'; then
                echo "::error file=$file::Do not update the adapter version constant in PRs. Adapter versions are bumped automatically during release; add release notes under '#### Next version' in CHANGELOG.md instead."
                FAILED=1
              fi
            elif [[ "$file" =~ ^adapters/.+/CHANGELOG\.md$ ]]; then
              if echo "$ADDED_LINES" | grep -q -E '^\+[[:space:]]*####[[:space:]]+\[?[Vv]ersion\b'; then
                echo "::error file=$file::Do not add a '#### Version ...' heading in PRs. Add your release notes under '#### Next version' in CHANGELOG.md instead."
                FAILED=1
              fi
            fi
          done <<< "$MODIFIED_FILES"

          if [[ "$FAILED" -ne 0 ]]; then
            echo "Version updates detected in external PR. Revert version changes and place changelog entries under '#### Next version' (maintainers can add the 'allow-version-bump' label to override)."
            exit 1
          fi

  Build:
    needs: check-paths
    if: ${{ needs.check-paths.outputs.example == 'true' }}
    name: Build
    runs-on: macos-26

    steps:
      - name: Clone Repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # Available Xcode versions:
      # https://github.com/actions/runner-images/blob/main/images/macos/toolsets/toolset-26.json
      - name: Select Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode_26.4.1.app/Contents/Developer
          echo "Selected Xcode version:"
          /usr/bin/xcodebuild -version

      - name: Install xcpretty
        run: sudo gem install xcpretty

      - name: Build Mediation MediationExample Project Scheme
        run: |
          cd ./example
          export BUILD_SNIPPETS=1
          if [[ -f "Podfile" ]]; then
            echo "Podfile found. Installing CocoaPods and building with MediationExample.xcworkspace.";
            pod install --no-repo-update;
            echo "Building app MediationExample with CocoaPods.";
            if ! xcodebuild -workspace MediationExample.xcworkspace -scheme "MediationExample" -sdk iphonesimulator -arch x86_64 | xcpretty; then
              echo "Build failed for MediationExample."
              exit 1
            fi
          fi

  all-checks-passed:
    needs: [check-paths, Build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check Status
        env:
          CHECK_PATHS_RESULT: ${{ needs.check-paths.result }}
          BUILD_RESULT: ${{ needs.Build.result }}
        run: |
          if [[ "$CHECK_PATHS_RESULT" == "failure" || "$CHECK_PATHS_RESULT" == "cancelled" ]]; then
            echo "check-paths failed or was cancelled."
            exit 1
          fi
          if [[ "$BUILD_RESULT" == "failure" || "$BUILD_RESULT" == "cancelled" ]]; then
            echo "Build failed or was cancelled."
            exit 1
          fi
          echo "All checks completed successfully or were skipped."
